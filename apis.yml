name: Cloudistics (Fungible)
description: 'Cloudistics was a composable, hyperconverged cloud infrastructure software
  company whose platform managed applications, virtual machines, storage, and networking
  across on-premises datacenters via a REST API and an official Python client (with the
  ccli command-line tool). Fungible acquired the Cloudistics software team and assets in
  September 2020 to build DPU-powered hyperdisaggregated infrastructure, and Microsoft
  acquired Fungible in January 2023 to bolster Azure datacenter networking and storage.
  As independent companies both are now defunct: the primary product domains are parked,
  the public GitHub organization has been emptied, and the PyPI package has been removed.
  The one surviving public developer surface is the read-only Cloudistics API Python
  Client documentation hosted on Read the Docs. This profile is retained as a historical
  API Evangelist network record.'
